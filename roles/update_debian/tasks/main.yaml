---
# get packages before upgrade
- name: get packages before upgrade
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${binary:Package}|${Version}\n"
  register: packages_before

# update debian
- name: update debian
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

# get packages after upgrade
- name: get packages after upgrade
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${binary:Package}|${Version}\n"
  register: packages_after

# convert package inventories to dictionaries
- name: convert package inventories to dictionaries
  ansible.builtin.set_fact:
    packages_before_dict: >-
      {{
        dict(
          packages_before.stdout_lines
          | map('split', '|', 1)
        )
      }}
    packages_after_dict: >-
      {{
        dict(
          packages_after.stdout_lines
          | map('split', '|', 1)
        )
      }}

# initialize package_changes
- name: initialize package_changes
  ansible.builtin.set_fact:
    package_changes: []

# identify packages with changed versions
- name: identify packages with changed versions
  ansible.builtin.set_fact:
    package_changes: >-
      {{ package_changes + [
        item ~ ': ' ~ packages_before_dict[item]
        ~ ' -> ' ~ packages_after_dict[item]
      ] }}
  loop: "{{ packages_before_dict.keys() | intersect(packages_after_dict.keys()) | list }}"
  when: packages_before_dict[item] != packages_after_dict[item]

# check if reboot is required
- name: check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

# set reboot message fact
- name: set reboot message fact
  ansible.builtin.set_fact:
    reboot_message: >-
      {% if reboot_required.stat.exists %}
      A reboot is required.
      {% else %}
      No reboot is needed.
      {% endif %}

# send notification
- name: send notification
  when: package_changes | length > 0
  ansible.builtin.uri:
    url: "{{ notification_webhook }}"
    method: POST
    body_format: json
    body: 
      content: |
        Succesfully installed package updates on: {{ inventory_hostname }}

        {% for package in package_changes %}
        - {{ package }}
        {% endfor %}

        {{ reboot_message }}
    status_code: 204
